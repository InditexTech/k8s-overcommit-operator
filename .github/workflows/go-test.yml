name: ⚒️ Go tests and linting for the webhook
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Test 🔨
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🧲
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

    - name: Restore go build cache ⏬
      uses: actions/cache@v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-go-build-v1

    - name: Setup Go ⬇️
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
      with:
        go-version: 1.26.8

    - name: Build and test 🏗️
      run: |
        make build
        make test

  lint:
    name: Lint 🔍
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🧲
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

    - name: Restore go build cache ⏬
      uses: actions/cache@v6
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-go-build-v1

    - name: Setup Go ⬇️
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
      with:
        go-version: 1.26.8

    - name: Linter 🔍
      run: |
        make lint
