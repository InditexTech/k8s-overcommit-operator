name: Check Code Generation 🧪
on:
    pull_request:
permissions:
  contents: read
jobs:
  check-dependencies-gen:
    name: Check Go Modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🧲
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Go ⬇️
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: 1.26.8

      - name: Check dependencies Generation 🧪
        run: |
            go mod tidy
            git diff  --ignore-matching-lines='.*createdAt:.*' --exit-code

  check-code-gen:
    name: Check SDK Code Generation 🧪
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🧲
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Go ⬇️
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: 1.26.8

      - name: Check SDK Code Generation 🧪
        run: |
            make generate manifests
            git diff  --ignore-matching-lines='.*createdAt:.*' --exit-code
