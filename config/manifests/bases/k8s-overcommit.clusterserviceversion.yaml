apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: OpenShift Optional
    com.redhat.openshift.versions: v4.15
    containerImage: ghcr.io/inditextech/k8s-overcommit-operator:1.3.6
    description: Lower pod resource requests from declarative overcommit classes,
      so the scheduler can pack more workloads per node.
    repository: https://github.com/InditexTech/k8s-overcommit-operator
    support: https://github.com/InditexTech/k8s-overcommit-operator/issues
  name: k8s-overcommit.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: OvercommitClass is the Schema for the overcommitclasses API
      displayName: Overcommit Class
      kind: OvercommitClass
      name: overcommitclasses.overcommit.inditex.dev
      version: v1alphav1
    - description: Overcommit is the Schema for the overcommits API
      displayName: Overcommit
      kind: Overcommit
      name: overcommits.overcommit.inditex.dev
      version: v1alphav1
  description: |
    The K8s Overcommit Operator manages pod resource overcommit on Kubernetes clusters.
    It rewrites container requests at admission time as ratio x limit, driven by
    declarative OvercommitClass resources, so the scheduler can pack more workloads per
    node without touching the limits that protect the node.

    ### Features
    - Overcommit classes with per-class CPU and memory ratios, namespace exclusions, node selectors and tolerations.
    - One mutating webhook per class, generated and reconciled by the operator itself.
    - Default class for namespace-level opt-in through a single label.
    - Idempotent mutation: pods already processed by a class are skipped on re-admission.

    ### Prerequisites
    - cert-manager is mandatory: the operator creates one self-signed Issuer and a Certificate per overcommit class, and without them the generated webhooks never get a serving certificate. The bundle declares it as an OLM dependency on cert-manager.io/v1 (Certificate, Issuer), so OLM installs cert-manager when no operator provides that API.
    - The operator installs cluster-wide (AllNamespaces) and creates MutatingWebhookConfigurations.
  displayName: K8s Overcommit Operator
